[package]
name = "livetab-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
# CUDA ist ein opt-in Windows-Desktopprofil; Standard- und Mobil-Builds bleiben CPU-portabel.
cuda = ["llama-cpp-4/cuda"]

[dependencies]
livetab-core = { path = "../livetab-core" }
serde.workspace = true
serde_json = "1.0"
slint = { version = "=1.18.1", features = ["backend-winit", "image-default-formats"] }
cpal = "=0.15.3"
mp3lame-encoder = "=0.3.0"

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.16.0", default-features = false }
llama-cpp-4 = { version = "=0.11.0", default-features = false, features = ["openmp", "native", "dynamic-link"] }
wasapi = "=0.26.0"
azo = { version = "=0.6.1", default-features = false }
crossbeam-channel = "=0.5.17"

[target.'cfg(not(windows))'.dependencies]
llama-cpp-4 = { version = "=0.11.0", default-features = false }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile = "3.22"
